<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes 每日进化报告</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050807;
      --card: #0d1512;
      --card-2: #121f1a;
      --line: #22362f;
      --text: #f4fff9;
      --muted: #9fb6ad;
      --green: #42f58d;
      --green-2: #13b862;
      --warn: #f7c948;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 20% 0%, rgba(66, 245, 141, .12), transparent 32%), var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 40px; }
    header { display: grid; gap: 12px; margin-bottom: 22px; }
    .eyebrow { color: var(--green); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 48px); line-height: 1.05; }
    .subtitle { margin: 0; color: var(--muted); max-width: 760px; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
    .card { grid-column: span 12; background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015)); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 16px 50px rgba(0,0,0,.28); }
    .metric { grid-column: span 3; min-height: 120px; }
    .wide { grid-column: span 8; }
    .side { grid-column: span 4; }
    .half { grid-column: span 6; }
    .label { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .value { font-size: 34px; font-weight: 750; letter-spacing: -0.03em; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; color: var(--muted); font-size: 12px; }
    .pill.ok { color: var(--green); border-color: rgba(66,245,141,.42); background: rgba(66,245,141,.08); }
    .pill.warn { color: var(--warn); border-color: rgba(247,201,72,.42); background: rgba(247,201,72,.08); }
    h2 { margin: 0 0 14px; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    td { font-size: 14px; }
    .muted { color: var(--muted); }
    .progress { height: 8px; width: 100%; background: #0a0f0d; border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,255,255,.06); }
    .bar { height: 100%; background: linear-gradient(90deg, var(--green-2), var(--green)); border-radius: 999px; }
    .list { display: grid; gap: 10px; }
    .item { padding: 12px; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; background: rgba(255,255,255,.025); }
    .item strong { display: block; margin-bottom: 4px; }
    .footer { margin-top: 18px; color: var(--muted); font-size: 12px; }
    .history { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    select { color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .skeleton { min-height: 80px; border-radius: 14px; background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.09), rgba(255,255,255,.04)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (max-width: 860px) { .metric, .wide, .side, .half { grid-column: span 12; } table { display: block; overflow-x: auto; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Hermes Evolution Report</div>
    <h1>每日进化报告</h1>
    <p class="subtitle">从控制中心实时快照生成：只展示脱敏后的 Agent、任务和会话状态，不展示 prompt、消息正文、Token 或密钥。</p>
    <div id="status" class="pill warn">正在读取快照…</div>
    <div class="history"><label for="report-date" class="muted">历史日报</label><select id="report-date"><option value="">实时报告</option></select></div>
  </header>

  <section class="grid" id="metrics">
    <article class="card metric"><div class="label">Agent / 模型</div><div class="value skeleton"></div></article>
    <article class="card metric"><div class="label">任务总数</div><div class="value skeleton"></div></article>
    <article class="card metric"><div class="label">活跃任务</div><div class="value skeleton"></div></article>
    <article class="card metric"><div class="label">会话数</div><div class="value skeleton"></div></article>
  </section>

  <section class="grid" style="margin-top:14px">
    <article class="card wide">
      <h2>今日结论</h2>
      <div id="conclusion" class="skeleton"></div>
    </article>
    <article class="card side">
      <h2>状态信号</h2>
      <div id="signals" class="list"><div class="skeleton"></div></div>
    </article>
    <article class="card half">
      <h2>异常</h2>
      <div id="anomaly" class="muted">实时报告尚未归档。</div>
    </article>
    <article class="card half">
      <h2>下一步</h2>
      <div id="next-step" class="muted">归档后生成明确行动建议。</div>
    </article>
    <article class="card wide">
      <h2>最近执行任务</h2>
      <div id="tasks"><div class="skeleton"></div></div>
    </article>
    <article class="card side">
      <h2>Agent 概览</h2>
      <div id="agents" class="list"><div class="skeleton"></div></div>
    </article>
    <article class="card">
      <h2>最近会话</h2>
      <div id="sessions"><div class="skeleton"></div></div>
    </article>
  </section>
  <div class="footer" id="footer">报告生成中…</div>
</main>
<script>
const fmtTime = (v) => v ? new Date(v).toLocaleString('zh-CN', { hour12: false }) : '—';
const esc = (s) => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const pct = (n) => Math.max(0, Math.min(100, Number(n || 0)));
function taskStatusText(s) {
  return ({running:'执行中', active:'执行中', ready:'等待中', todo:'待处理', completed:'已完成', failed:'失败', blocked:'阻塞'}[s] || s || '未知');
}
function renderMetrics(data) {
  const tasks = data.all_tasks || [];
  const active = tasks.filter(t => t.is_running || ['running','active','ready','todo','blocked'].includes(t.status)).length;
  const metrics = [
    ['Agent / 模型', (data.agents || []).length, '按会话模型聚合'],
    ['任务总数', tasks.length, '包含完成/失败/进行中'],
    ['活跃任务', active, active ? '有任务需要关注' : '暂无活跃任务'],
    ['会话数', (data.sessions || []).length, '脱敏会话索引']
  ];
  document.getElementById('metrics').innerHTML = metrics.map(([label, value, hint]) => `<article class="card metric"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></article>`).join('');
}
function renderConclusion(data, report) {
  const tasks = data.all_tasks || [];
  const failed = tasks.filter(t => t.status === 'failed').length;
  const running = tasks.filter(t => t.is_running).length;
  const recent = data.recent_tasks || [];
  let text = '当前没有收到 Mac Connector 快照，报告保留骨架状态。';
  if (data.has_snapshot) {
    text = failed > 0
      ? `今天最需要关注的是 ${failed} 个失败任务；建议先处理失败原因，再继续新增自动化。`
      : running > 0
        ? `系统正在运行 ${running} 个任务；整体链路可见，优先观察是否按预期完成。`
        : `当前没有失败或执行中任务；Hermes 状态稳定，可以继续沉淀资料库和自动报告。`;
  }
  if (report && report.conclusion) text = report.conclusion;
  document.getElementById('conclusion').innerHTML = `<p>${esc(text)}</p><p class="muted">最近任务记录：${recent.length} 条；快照设备：${esc(data.device_id || '未知')}</p>`;
  document.getElementById('anomaly').textContent = report?.anomaly || '实时报告尚未归档；当前状态信号见右侧。';
  document.getElementById('next-step').textContent = report?.next_step || '归档后生成明确行动建议。';
}
function renderSignals(data) {
  const stale = data.snapshot_received_at ? ((Date.now() - new Date(data.snapshot_received_at).getTime()) / 1000) : Infinity;
  const signals = [
    {name:'快照', value:data.has_snapshot ? '已收到' : '未收到', ok:data.has_snapshot},
    {name:'新鲜度', value: stale < 90 ? '正常' : '可能过期', ok: stale < 90},
    {name:'Lark 交接', value:data.lark_handoff_available ? '可用' : (data.lark_handoff_reason || '未启用'), ok:data.lark_handoff_available}
  ];
  document.getElementById('signals').innerHTML = signals.map(s => `<div class="item"><span class="pill ${s.ok ? 'ok' : 'warn'}">${esc(s.name)}</span><strong>${esc(s.value)}</strong></div>`).join('');
}
function renderTasks(data) {
  const rows = (data.recent_tasks || []).slice(0, 12);
  if (!rows.length) { document.getElementById('tasks').innerHTML = '<p class="muted">暂无最近任务。</p>'; return; }
  document.getElementById('tasks').innerHTML = `<table><thead><tr><th>任务</th><th>状态</th><th>负责 Agent</th><th>进度</th><th>最近运行</th></tr></thead><tbody>${rows.map(t => `<tr><td>${esc(t.title || t.id)}</td><td>${esc(taskStatusText(t.status))}</td><td>${esc(t.responsible_agent || t.assignee || '—')}</td><td><div class="progress"><div class="bar" style="width:${pct(t.progress_percent)}%"></div></div><span class="muted">${pct(t.progress_percent)}%</span></td><td>${esc(fmtTime(t.last_run_at || t.started_at || t.completed_at))}</td></tr>`).join('')}</tbody></table>`;
}
function renderAgents(data) {
  const agents = data.agents || [];
  if (!agents.length) { document.getElementById('agents').innerHTML = '<p class="muted">暂无 Agent 数据。</p>'; return; }
  document.getElementById('agents').innerHTML = agents.map(a => `<div class="item"><strong>${esc(a.model)}</strong><div class="muted">会话 ${a.total_session_count} · 活跃 ${a.active_session_count}</div></div>`).join('');
}
function renderSessions(data) {
  const sessions = (data.sessions || []).slice(0, 10);
  if (!sessions.length) { document.getElementById('sessions').innerHTML = '<p class="muted">暂无会话。</p>'; return; }
  document.getElementById('sessions').innerHTML = `<table><thead><tr><th>标题</th><th>模型</th><th>消息</th><th>工具</th><th>最近活动</th></tr></thead><tbody>${sessions.map(s => `<tr><td>${esc(s.title || s.id)}<div class="muted">${esc(s.profile_name || '')}</div></td><td>${esc(s.model || '未知')}</td><td>${s.message_count || 0}</td><td>${s.tool_call_count || 0}</td><td>${esc(fmtTime(s.last_activity_at || s.started_at))}</td></tr>`).join('')}</tbody></table>`;
}
async function main() {
  const status = document.getElementById('status');
  try {
    const params = new URLSearchParams(window.location.search);
    const selectedDate = params.get('date') || '';
    const indexRes = await fetch('/api/v1/reports/daily', { credentials: 'same-origin' });
    if (indexRes.ok) {
      const index = await indexRes.json();
      const select = document.getElementById('report-date');
      (index.dates || []).forEach(date => select.insertAdjacentHTML('beforeend', `<option value="${esc(date)}">${esc(date)}</option>`));
      select.value = selectedDate;
      select.addEventListener('change', () => {
        const next = select.value ? `/reports/daily?date=${encodeURIComponent(select.value)}` : '/reports/daily';
        window.location.assign(next);
      });
    }
    const endpoint = selectedDate ? `/api/v1/reports/daily/${encodeURIComponent(selectedDate)}` : '/api/v1/dashboard';
    const res = await fetch(endpoint, { credentials: 'same-origin' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    const report = selectedDate ? payload : null;
    const data = report ? report.dashboard : payload;
    renderMetrics(data); renderConclusion(data, report); renderSignals(data); renderTasks(data); renderAgents(data); renderSessions(data);
    status.className = 'pill ok';
    status.textContent = report ? `${report.date} 历史日报` : (data.has_snapshot ? '实时快照已加载' : '等待 Connector 快照');
    document.getElementById('footer').textContent = `生成时间：${fmtTime(report?.generated_at || data.generated_at)} · 快照时间：${fmtTime(data.snapshot_taken_at)} · 接收时间：${fmtTime(data.snapshot_received_at)}`;
  } catch (err) {
    status.className = 'pill warn';
    status.textContent = '读取失败';
    document.getElementById('conclusion').innerHTML = `<p>报告读取失败：${esc(err.message)}。请确认访问码会话有效，或稍后重试。</p>`;
  }
}
main();
</script>
</body>
</html>
